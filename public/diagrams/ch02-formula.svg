<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="880" height="320" fill="#ffffff"/>

  <!-- Agent 是包含模型与运行程序的完整系统 -->
  <rect x="28" y="24" width="824" height="220" rx="16" fill="#f6f8fa" stroke="#3c8cff" stroke-width="2"/>
  <text x="50" y="53" font-size="17" font-weight="700" fill="#1a4f8f">Code Agent（完整运行系统）</text>

  <!-- LLM -->
  <rect x="60" y="76" width="224" height="126" rx="12" fill="#eaf3ff" stroke="#3c8cff" stroke-width="1.8"/>
  <text x="172" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#1a4f8f">LLM</text>
  <text x="172" y="150" text-anchor="middle" font-size="13.5" fill="#1a4f8f">理解任务并决定下一步</text>
  <text x="172" y="176" text-anchor="middle" font-size="12" fill="#57606a">模型能力</text>

  <text x="316" y="148" text-anchor="middle" font-size="26" fill="#57606a">+</text>

  <!-- Agent 内部位于模型之外的运行程序 -->
  <rect x="350" y="64" width="470" height="152" rx="12" fill="#ffffff" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="585" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="#24292f">Agent 运行程序（Harness）</text>

  <!-- 上下文 -->
  <rect x="370" y="106" width="194" height="70" rx="9" fill="#e6f6ec" stroke="#2da44e" stroke-width="1.5"/>
  <text x="467" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#116329">准备上下文</text>
  <text x="467" y="158" text-anchor="middle" font-size="12" fill="#57606a">指令 · 历史 · 检索结果</text>

  <!-- 工具 -->
  <rect x="584" y="106" width="216" height="70" rx="9" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="692" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#7d4e00">执行工具</text>
  <text x="692" y="158" text-anchor="middle" font-size="12" fill="#57606a">读取 · 修改 · 运行</text>

  <text x="585" y="200" text-anchor="middle" font-size="12.5" fill="#57606a">还负责权限、状态、验证和恢复</text>

  <text x="440" y="276" text-anchor="middle" font-size="13.5" fill="#24292f">Agent = LLM + 位于模型之外的运行程序</text>
  <text x="440" y="300" text-anchor="middle" font-size="12.5" fill="#57606a">上下文和工具由 Agent 管理,不是与 Agent 并列的其他主体</text>
</svg>
