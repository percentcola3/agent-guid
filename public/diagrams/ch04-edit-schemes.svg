<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#24292f">八个文件编辑方案或组合(定性示意,不是实测排名)</text>

  <!-- 理想区 -->
  <rect x="110" y="70" width="330" height="170" rx="10" fill="#2da44e" opacity="0.07"/>
  <text x="432" y="222" text-anchor="end" font-size="12.5" fill="#116329">绿色区域:期望的低定位 token 成本、高可靠性</text>

  <!-- 坐标轴 -->
  <line x1="100" y1="480" x2="830" y2="480" stroke="#57606a" stroke-width="1.8"/>
  <path d="M 830 480 L 820 475 L 820 485 z" fill="#57606a"/>
  <line x1="100" y1="480" x2="100" y2="60" stroke="#57606a" stroke-width="1.8"/>
  <path d="M 100 60 L 95 70 L 105 70 z" fill="#57606a"/>
  <text x="872" y="468" text-anchor="end" font-size="12.5" fill="#57606a">定位 token 成本 →高</text>
    <text x="112" y="52" font-size="13" fill="#57606a">定位可靠性→高</text>
  <text x="140" y="502" font-size="12" fill="#8b949e">低</text>
  <text x="450" y="502" font-size="12" fill="#8b949e">中</text>
  <text x="760" y="502" font-size="12" fill="#8b949e">高</text>
  <line x1="465" y1="70" x2="465" y2="480" stroke="#d0d7de" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="100" y1="275" x2="830" y2="275" stroke="#d0d7de" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- 图例 -->
  <circle cx="120" cy="530" r="7" fill="#2da44e"/><text x="133" y="535" font-size="12.5" fill="#57606a">基础设施:无 / 低</text>
  <circle cx="290" cy="530" r="7" fill="#3c8cff"/><text x="303" y="535" font-size="12.5" fill="#57606a">中(需配套)</text>
  <circle cx="450" cy="530" r="7" fill="#8250df"/><text x="463" y="535" font-size="12.5" fill="#57606a">高(需训专用模型)</text>

  <!-- 数据点 -->
  <circle cx="200" cy="108" r="10" fill="#8250df"/>
  <text x="200" y="90" text-anchor="middle" font-size="13.5" font-weight="600" fill="#6f42c1">Apply Model(Cursor)</text>
  <text x="200" y="132" text-anchor="middle" font-size="11.5" fill="#8b949e">fast-apply 小模型合并</text>

  <circle cx="636" cy="118" r="10" fill="#2da44e"/>
  <text x="636" y="100" text-anchor="middle" font-size="13.5" font-weight="600" fill="#116329">old/new + 版本检查(dsh)</text>
  <text x="636" y="142" text-anchor="middle" font-size="11.5" fill="#8b949e">版本锁 + 先读后改</text>

  <circle cx="280" cy="158" r="10" fill="#3c8cff"/>
  <text x="280" y="182" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a4f8f">锚点 hashline(grok)</text>
  <text x="280" y="200" text-anchor="middle" font-size="11.5" fill="#8b949e">行号+哈希;可在前后 15 行重找</text>

  <circle cx="392" cy="126" r="10" fill="#3c8cff"/>
  <text x="392" y="108" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a4f8f">apply_patch(codex)</text>
  <text x="392" y="148" text-anchor="middle" font-size="11.5" fill="#8b949e">freeform diff + 4 种匹配精度</text>

  <circle cx="700" cy="196" r="10" fill="#2da44e"/>
  <text x="700" y="178" text-anchor="middle" font-size="13.5" font-weight="600" fill="#116329">old/new string</text>
  <text x="700" y="220" text-anchor="middle" font-size="11.5" fill="#8b949e">无需额外服务,适合起步(Claude Code)</text>

  <circle cx="540" cy="232" r="10" fill="#2da44e"/>
  <text x="540" y="254" text-anchor="middle" font-size="13" font-weight="600" fill="#116329">首尾匹配</text>

  <circle cx="240" cy="386" r="10" fill="#2da44e"/>
  <text x="240" y="368" text-anchor="middle" font-size="13.5" font-weight="600" fill="#57606a">行号定位</text>
  <text x="240" y="410" text-anchor="middle" font-size="11.5" fill="#8b949e">容易受行号计算和文件漂移影响</text>

  <circle cx="330" cy="430" r="10" fill="#2da44e"/>
  <text x="330" y="452" text-anchor="middle" font-size="13.5" font-weight="600" fill="#57606a">类 Vim 命令</text>
  <text x="330" y="472" text-anchor="middle" font-size="11.5" fill="#8b949e">模型负担大</text>
</svg>
