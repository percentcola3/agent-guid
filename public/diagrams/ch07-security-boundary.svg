<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arwP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="540" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#24292f">三家怎样检查并限制模型生成的命令</text>

  <!-- 顶层命令流 -->
  <rect x="30" y="66" width="180" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="120" y="88" text-anchor="middle" font-size="13.5" fill="#24292f">模型输出命令</text>
  <text x="120" y="106" text-anchor="middle" font-size="11.5" fill="#8b949e">(概率性,不可信)</text>

  <line x1="210" y1="92" x2="248" y2="92" stroke="#57606a" stroke-width="1.8" marker-end="url(#arw)"/>

  <rect x="252" y="66" width="210" height="52" rx="8" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="357" y="88" text-anchor="middle" font-size="13.5" fill="#7d4e00">执行前检查命令</text>
  <text x="357" y="106" text-anchor="middle" font-size="11.5" fill="#7d4e00">决定「要不要问人」</text>

  <line x1="462" y1="92" x2="500" y2="92" stroke="#57606a" stroke-width="1.8" marker-end="url(#arw)"/>

  <rect x="504" y="66" width="200" height="52" rx="8" fill="#e6f6ec" stroke="#2da44e" stroke-width="1.5"/>
  <text x="604" y="88" text-anchor="middle" font-size="13.5" fill="#116329">操作系统限制访问</text>
  <text x="604" y="106" text-anchor="middle" font-size="11.5" fill="#116329">阻止越权访问</text>

  <line x1="704" y1="92" x2="742" y2="92" stroke="#57606a" stroke-width="1.8" marker-end="url(#arw)"/>

  <rect x="746" y="66" width="106" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="799" y="88" text-anchor="middle" font-size="12" fill="#24292f">文件/网络</text>
  <text x="799" y="106" text-anchor="middle" font-size="12" fill="#24292f">进程/设备</text>

  <!-- 事前分析层下:三家选择 -->
  <text x="357" y="158" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7d4e00">三家执行前分别检查什么</text>

  <rect x="252" y="170" width="210" height="56" rx="8" fill="#ffffff" stroke="#d4a72c" stroke-width="1.2"/>
  <text x="357" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#7d4e00">codex</text>
  <text x="357" y="212" text-anchor="middle" font-size="12" fill="#57606a">规则引擎 + tree-sitter 拆段</text>

  <rect x="252" y="236" width="210" height="56" rx="8" fill="#ffffff" stroke="#d4a72c" stroke-width="1.2"/>
  <text x="357" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#7d4e00">grok</text>
  <text x="357" y="278" text-anchor="middle" font-size="12" fill="#57606a">检查项最多;解析失败就询问用户</text>

  <rect x="252" y="302" width="210" height="56" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="357" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#6f42c1">dsh</text>
  <text x="357" y="344" text-anchor="middle" font-size="12" fill="#6f42c1">不分析命令,由操作系统直接限制</text>

  <!-- dsh 直接交给操作系统限制 -->
  <path d="M 120 118 C 120 200, 220 200, 250 200 L 250 330 C 300 400, 520 400, 560 330 L 580 118"
        fill="none" stroke="#8250df" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arwP)"/>
  <text x="60" y="290" font-size="12" fill="#6f42c1" transform="rotate(-90 60 290)">dsh 跳过分析</text>

  <!-- 内核沙箱下:共有机制 -->
  <line x1="604" y1="118" x2="604" y2="150" stroke="#2da44e" stroke-width="1.5" marker-end="url(#arw)"/>
  <rect x="504" y="154" width="200" height="88" rx="8" fill="#e6f6ec" stroke="#2da44e" stroke-width="1.2"/>
  <text x="604" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#116329">按平台和产品选择不同后端</text>
  <text x="604" y="200" text-anchor="middle" font-size="12" fill="#116329">例如 Seatbelt / Landlock</text>
  <text x="604" y="218" text-anchor="middle" font-size="12" fill="#116329">seccomp / bwrap / Windows ACL</text>
  <text x="604" y="236" text-anchor="middle" font-size="12" fill="#116329">dsh Landlock:先限制自身,再 exec</text>

  <!-- 被拒后:升级路径 -->
  <line x1="704" y1="118" x2="746" y2="160" stroke="#57606a" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arw)"/>
  <rect x="560" y="268" width="300" height="150" rx="10" fill="#eaf3ff" stroke="#3c8cff" stroke-width="1.4"/>
  <text x="710" y="292" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a4f8f">被拒后怎样申请额外权限</text>
  <text x="578" y="316" font-size="12" fill="#24292f">• codex:request_permissions 工具</text>
  <text x="578" y="336" font-size="12" fill="#24292f">• dsh:原地升级重试一次</text>
  <text x="596" y="354" font-size="11.5" fill="#57606a">(sandbox_permissions + justification,</text>
  <text x="596" y="370" font-size="11.5" fill="#57606a">allowed-once 仅本次生效)</text>
  <text x="578" y="394" font-size="12" fill="#24292f">• grok:记住拒绝,相同请求继续禁止</text>

  <!-- 底部结论 -->
  <rect x="30" y="452" width="830" height="46" rx="10" fill="#24292f"/>
  <text x="445" y="480" text-anchor="middle" font-size="14" fill="#ffffff">执行前分析改善审批体验;OS 或容器才是强制边界;高风险产品可叠加两层</text>
</svg>
