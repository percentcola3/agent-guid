<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>

  <!-- Goal -->
  <rect x="300" y="20" width="280" height="64" rx="10" fill="#eaf3ff" stroke="#3c8cff" stroke-width="1.8"/>
  <text x="440" y="46" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1a4f8f">Goal / 单独保存的任务控制状态</text>
  <text x="440" y="70" text-anchor="middle" font-size="12" fill="#1a4f8f">目标 · 验收条件 · 预算 · 暂停 · revision</text>

  <line x1="440" y1="84" x2="440" y2="130" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Agent loop -->
  <rect x="330" y="134" width="220" height="52" rx="10" fill="#f6f8fa" stroke="#24292f" stroke-width="1.8"/>
  <text x="440" y="165" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24292f">Agent loop</text>

  <!-- 会话事件日志 -->
  <line x1="440" y1="186" x2="440" y2="230" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="466" y="214" font-size="11.5" fill="#57606a">记录事件</text>

  <rect x="250" y="234" width="380" height="56" rx="10" fill="#e6f6ec" stroke="#2da44e" stroke-width="1.8"/>
  <text x="440" y="258" text-anchor="middle" font-size="14.5" font-weight="600" fill="#116329">可恢复的会话记录(追加事件或等价日志)</text>
  <text x="440" y="280" text-anchor="middle" font-size="12" fill="#116329">用户消息 · 完整回复 · 工具请求/结果 · turn 边界</text>

  <!-- 根据日志计算 -->
  <line x1="330" y1="290" x2="200" y2="342" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="290" x2="680" y2="342" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="322" font-size="11.5" fill="#57606a">计算</text>
  <text x="640" y="322" font-size="11.5" fill="#57606a">计算</text>

  <rect x="60" y="346" width="280" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="200" y="372" text-anchor="middle" font-size="13.5" font-weight="600" fill="#24292f">发给模型的上下文(可重新计算)</text>
  <text x="200" y="396" text-anchor="middle" font-size="12" fill="#57606a">从日志 + Goal + 配置重新组装</text>

  <rect x="540" y="346" width="280" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="680" y="372" text-anchor="middle" font-size="13.5" font-weight="600" fill="#24292f">UI 当前状态(可重新计算)</text>
  <text x="680" y="396" text-anchor="middle" font-size="11.5" fill="#57606a">由记录重建;是否保存实时增量需明确选择</text>

  <!-- 外部世界 -->
  <line x1="330" y1="160" x2="196" y2="184" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="238" y="158" font-size="11.5" fill="#57606a">工具执行</text>
  <rect x="56" y="188" width="140" height="52" rx="10" fill="#fddbcc" stroke="#cf5b4d" stroke-width="1.5"/>
  <text x="126" y="210" text-anchor="middle" font-size="13.5" font-weight="600" fill="#932b1f">外部世界</text>
  <text x="126" y="230" text-anchor="middle" font-size="11.5" fill="#932b1f">文件 / API / 数据库</text>
  <path d="M 126 240 C 126 290, 300 280, 330 250" fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="58" y="282" font-size="11.5" fill="#8b949e">请求已记录 ≠ 操作已完成</text>

  <!-- 长期记忆 -->
  <rect x="620" y="120" width="230" height="64" rx="10" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="735" y="146" text-anchor="middle" font-size="13.5" font-weight="600" fill="#7d4e00">长期记忆(独立知识库)</text>
  <text x="735" y="170" text-anchor="middle" font-size="11.5" fill="#7d4e00">确认后写入 / 限制范围 / 按需查找</text>
  <line x1="620" y1="160" x2="554" y2="160" stroke="#57606a" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 遥测 -->
  <rect x="60" y="440" width="760" height="56" rx="10" fill="#ffffff" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="440" y="464" text-anchor="middle" font-size="13" fill="#57606a">运行统计:延迟 · token · 错误率 · 调用记录 —— 即使丢失,也不应影响会话恢复</text>
  <text x="440" y="486" text-anchor="middle" font-size="12.5" fill="#8b949e">这里先保存事件,再重建状态;Redux reducer 只用于说明“由事件计算状态”</text>
</svg>
